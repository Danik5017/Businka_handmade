{% extends 'base.html' %}

{% block title %}Вхід — OLX{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border-0 shadow-sm p-4 bg-white" style="border-radius: 4px;">
            <h1 class="h3 fw-bold mb-4 text-center" style="color: var(--olx-brand);">Вхід на сайт</h1>
            
            <form method="POST">
                {% csrf_token %}
                
                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label fw-bold" style="color: var(--olx-brand);">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="text-danger small mt-1">{{ field.errors|first }}</div>
                    {% endif %}
                </div>
                {% endfor %}
                
                <button type="submit" class="btn w-100 py-3 text-white fw-bold border-0 mt-3" style="background-color: var(--olx-brand); font-size: 16px; border-radius: 4px;">
                    Увійти
                </button>
            </form>
            
            <div class="text-center mt-3">
                <a href="{% url 'register' %}" class="small text-decoration-none" style="color: var(--olx-gray);">Немає акаунту? Зареєструватися</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
